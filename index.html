<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirstAttackGame</title>
</head>
<body>

<h2 id="cpuHP">CPUのHP: 20</h2>
<div style="width:200px;background-color:gray;">
	<div id="cpuBar" style="height:20px;width:100%;background-color:red;"></div>
</div>

<hr>

<h2 id="playerHP">あなたのHP: 20</h2>
<div style="width:200px;background-color:gray;">
	<div id="playerBar" style="height:20px;width:100%;background-color:green;"></div>
</div>

<button onclick="playerAttack()">通常攻撃</button>
<button onclick="playerSpecialAttack()">特殊攻撃</button>
<button onclick="playerDefend()">チャージ</button>
<button onclick="resetGame()">リセット</button>

<h3>ログ</h3>
<div id="log"></div>

<script>
let playerMaxHP = 20;
let cpuMaxHP = 20;

let playerHP = playerMaxHP;
let cpuHP = cpuMaxHP;

let playerPower = 1;
let cpuPower = 1;

let playerBuff = 0;
let cpuBuff = 0;

let isProcessing = false;

// ==================== 共通 ====================

function random(min, max){
	return Math.floor(Math.random()*(max-min+1))+min;
}

function addLog(message){
	document.getElementById("log").innerHTML += message + "<br>";
}

function updateDisplay(){
	let playerPercent = (playerHP/playerMaxHP)*100;
	let cpuPercent = (cpuHP/cpuMaxHP)*100;

	document.getElementById("playerBar").style.width = playerPercent+"%";
	document.getElementById("cpuBar").style.width = cpuPercent+"%";

	document.getElementById("playerHP").textContent = "あなたのHP: " + playerHP;
	document.getElementById("cpuHP").textContent = "CPUのHP: " + cpuHP;
}

function checkGameEnd(){
	if(cpuHP <= 0){
		cpuHP = 0;
		addLog("あなたの勝ち！");
		updateDisplay();
		return true;
	}
	if(playerHP <= 0){
		playerHP = 0;
		addLog("あなたの負け...");
		updateDisplay();
		return true;
	}
	return false;
}

function turnEnd(){
	if(playerBuff > 0){
		playerBuff--;
		if(playerBuff === 0){
			playerPower = 1;
		}
	}

	if(cpuBuff > 0){
		cpuBuff--;
		if(cpuBuff === 0){
			cpuPower = 1;
		}
	}

	isProcessing = false;
}

// ==================== プレイヤー行動 ====================

function playerAttack(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	let damage = Math.floor(random(3,7) * playerPower);
	addLog("あなたは"+damage+"ダメージ与えた");
	cpuHP -= damage;

	if(checkGameEnd()){ turnEnd(); return; }

	cpuTurn();
}

function playerSpecialAttack(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	let lucky = random(1,100);

	if(lucky === 100){
		addLog("必殺技発動！！");
		cpuHP = 0;
		checkGameEnd();
		turnEnd();
		return;
	}

	let damage = Math.floor(random(1,10) * playerPower);
	addLog("あなたは"+damage+"ダメージ与えた");
	cpuHP -= damage;

	if(checkGameEnd()){ turnEnd(); return; }

	cpuTurn();
}

function playerDefend(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	addLog("あなたは防御した！");
	playerPower = 1.5;
	playerBuff = 1;

	cpuTurn(true);
}

// ==================== CPUターン ====================

function cpuTurn(playerDefending=false){

	let action = random(1,11);

	// CPU防御
	if(action === 11){
		addLog("CPUは防御した！");
		cpuPower = 1.5;
		cpuBuff = 1;
		turnEnd();
		return;
	}

	let damage = Math.floor(action * cpuPower);

	if(playerDefending){
		damage = Math.floor(damage / 2);
	}

	addLog("CPUは"+damage+"ダメージ与えた");
	playerHP -= damage;

	checkGameEnd();
	updateDisplay();
	turnEnd();
}

// ==================== リセット ====================

function resetGame(){
	playerHP = playerMaxHP;
	cpuHP = cpuMaxHP;

	playerPower = 1;
	cpuPower = 1;

	playerBuff = 0;
	cpuBuff = 0;

	document.getElementById("log").innerHTML = "";
	updateDisplay();
}

</script>
</body>
</html>
