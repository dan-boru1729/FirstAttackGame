<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirstAttackGame</title>
</head>
<body>

<h2 id="cpuHP">CPUのHP: 20</h2>
<div style="width:200px;background-color:gray;">
	<div id="cpuBar" style="height:20px;width:100%;background-color:red;"></div>
</div>

<hr>

<h2 id="playerHP">あなたのHP: 20</h2>
<div style="width:200px;background-color:gray;">
	<div id="playerBar" style="height:20px;width:100%;background-color:green;"></div>
</div>

<button onclick="playerAttack()">通常攻撃</button>
<button onclick="playerSpecialAttack()">特殊攻撃</button>
<button onclick="playerDefend()">チャージ</button>
<button onclick="resetGame()">リセット</button>

<h3>ログ</h3>
<div id="log"></div>

<script>

let maxHP = 20;

let playerHP = maxHP;
let cpuHP = maxHP;

let playerPower = 1;
let cpuPower = 1;

let playerBuff = false;
let cpuBuff = false;

let isProcessing = false;

// ---------- 共通 ----------

function random(min, max){
	return Math.floor(Math.random()*(max-min+1))+min;
}

function addLog(message){
	document.getElementById("log").innerHTML += message + "<br>";
}

function updateDisplay(){
	document.getElementById("playerHP").textContent = "あなたのHP: " + playerHP;
	document.getElementById("cpuHP").textContent = "CPUのHP: " + cpuHP;

	document.getElementById("playerBar").style.width = (playerHP/maxHP)*100 + "%";
	document.getElementById("cpuBar").style.width = (cpuHP/maxHP)*100 + "%";
}

function checkGameEnd(){
	if(cpuHP <= 0){
		cpuHP = 0;
		addLog("あなたの勝ち！");
		updateDisplay();
		return true;
	}
	if(playerHP <= 0){
		playerHP = 0;
		addLog("あなたの負け...");
		updateDisplay();
		return true;
	}
	return false;
}

// ---------- プレイヤー ----------

function playerAttack(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	let damage = random(3,7);
	if(playerBuff){
		damage = Math.ceil(damage * 1.5);
		playerBuff = false;
		playerPower = 1;
		addLog("バフ効果で強化攻撃！");
	}

	addLog("あなたは"+damage+"ダメージ与えた");
	cpuHP -= damage;

	if(checkGameEnd()){ isProcessing=false; return; }

	cpuTurn();
}

function playerSpecialAttack(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	let lucky = random(1,100);
	if(lucky === 100){
		addLog("必殺技発動！！");
		cpuHP = 0;
		checkGameEnd();
		isProcessing=false;
		return;
	}

	let damage = random(1,10);
	if(playerBuff){
		damage = Math.ceil(damage * 1.5);
		playerBuff = false;
		playerPower = 1;
		addLog("バフ効果で強化攻撃！");
	}

	addLog("あなたは"+damage+"ダメージ与えた");
	cpuHP -= damage;

	if(checkGameEnd()){ isProcessing=false; return; }

	cpuTurn();
}

function playerDefend(){
	if(isProcessing || checkGameEnd()) return;
	isProcessing = true;

	addLog("あなたはチャージした！");
	playerBuff = true;

	cpuTurn(true);
}

// ---------- CPU ----------

function cpuTurn(playerDefending=false){

	let action = random(1,11);

	if(action === 11){
		addLog("CPUはチャージした！");
		cpuBuff = true;
		isProcessing=false;
		return;
	}

	let damage = action;

	if(cpuBuff){
		damage = Math.ceil(damage * 1.5);
		cpuBuff = false;
		addLog("CPUの強化攻撃！");
	}

	if(playerDefending){
		damage = Math.floor(damage / 2);
	}

	addLog("CPUは"+damage+"ダメージ与えた");
	playerHP -= damage;

	checkGameEnd();
	updateDisplay();

	isProcessing=false;
}

// ---------- リセット ----------

function resetGame(){
	playerHP = maxHP;
	cpuHP = maxHP;

	playerBuff = false;
	cpuBuff = false;

	document.getElementById("log").innerHTML = "";
	updateDisplay();
}

</script>
</body>
</html>
